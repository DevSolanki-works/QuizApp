<!--
  TUTORIAL COMPLETION — shown right after the guided Custom Topic game
  (Stage 3) finishes. Grants a reward if signed in, just a congrats
  message for guests. Always sets forge_tutorial_completed here — this
  is the ONLY place that flag gets set, so re-opening the app before
  reaching this screen correctly re-shows the tutorial from the start.
  Routes to Home, where a one-time mode-highlight overlay takes over.
-->
<style>
  .tsum-wrap {
    width: 100%; min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 24px; gap: 22px;
  }
  .tsum-complete-icon { font-size: 60px; animation: winner-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes winner-pop {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  .tsum-complete-title { font-family: var(--font-pixel); font-size: 16px; color: var(--white); letter-spacing: 1px; }
  .tsum-complete-sub {
    font-family: var(--font-body); font-size: 14px; font-weight: 700;
    color: rgba(255,255,255,0.6); text-align: center; max-width: 300px; line-height: 1.6;
  }
  .tsum-reward-box {
    width: 100%; max-width: 320px; padding: 18px;
    border-radius: var(--radius-md);
    background: rgba(255,217,61,0.1); border: 1.5px solid rgba(255,217,61,0.3);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .tsum-reward-amount { font-family: var(--font-pixel); font-size: 20px; color: var(--yellow); }
  .tsum-guest-note {
    font-family: var(--font-body); font-size: 13px; font-weight: 700;
    color: rgba(255,255,255,0.55); text-align: center; max-width: 300px; line-height: 1.6;
  }
</style>

<div class="tsum-wrap">
  <span class="tsum-complete-icon">🏆</span>
  <p class="tsum-complete-title">YOU'RE A FORGE PLAYER NOW!</p>
  <p class="tsum-complete-sub">Every game makes you sharper. Every win puts you higher on the board. Let's see what you've got.</p>

  <div class="tsum-reward-box" id="tsum-reward-box" style="display:none;">
    <span style="font-family:var(--font-pixel);font-size:7px;color:rgba(255,255,255,0.5);">TUTORIAL REWARD</span>
    <span class="tsum-reward-amount">+20 🪙 &nbsp; +1 🎟️</span>
  </div>
  <p class="tsum-guest-note" id="tsum-guest-note" style="display:none;">
    Sign in anytime from Home to save your progress and start earning rewards.
  </p>

  <button class="btn btn-primary" style="width:100%;max-width:320px;" onclick="tsumGoHome()">
    ⚡ &nbsp;LET'S PLAY FOR REAL
  </button>
</div>

<script>
function onTutorialSummaryShow() {
  _tsumGrantRewardIfSignedIn();
}

async function _tsumGrantRewardIfSignedIn() {
  const rewardBox = document.getElementById('tsum-reward-box');
  const guestNote = document.getElementById('tsum-guest-note');

  if (!State.user?.id) {
    if (guestNote) guestNote.style.display = 'block';
    Sound.gameStart();
    _tsumMarkCompleted();
    return;
  }

  try {
    const credential = State.user._credential;
    const res = await fetch(`${API_BASE}/tutorial/claim-reward`, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${credential}` },
      body   : JSON.stringify({ user_id: State.user.id }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.already_claimed) {
        // Reinstalled after already claiming once — no new reward,
        // server-side guard already prevented a second grant.
        _tsumMarkCompleted();
        return;
      }
      State.user.coins = data.coins;
      Session.save();
      if (typeof _markLocalEconomyWrite === 'function') _markLocalEconomyWrite();

      try {
        const ticketState = await API.getTickets(State.user.id);
        await API.syncTickets(
          State.user.id,
          Number(ticketState.tickets_today || 0) + 1,
          ticketState.ad_tickets_used_today || 0,
          ticketState.last_ticket_date || ''
        );
        State.user.tickets_today = Number(ticketState.tickets_today || 0) + 1;
        Session.save();
      } catch (e) {
        console.warn('[Tutorial] Ticket reward grant failed (non-fatal):', e);
      }
      if (typeof lbUpsertPlayer === 'function') {
        lbUpsertPlayer(State.user.id, State.user.name, State.user.coins, State.user.trophies).catch(() => {});
      }
      if (rewardBox) rewardBox.style.display = 'flex';
      Toast.success('Tutorial reward claimed!');
      Sound.correct();
    }
  } catch (e) {
    console.warn('[Tutorial] Reward grant failed (non-fatal):', e);
  }

  _tsumMarkCompleted();
}

function _tsumMarkCompleted() {
  try { localStorage.setItem('forge_tutorial_completed', '1'); } catch (_) {}
  // NOTE (Milestone 77 fix): forge_show_mode_highlight is NOT set here.
  // tutorial-intro.html's _tutProceed() already set it once, on entry
  // into the guided tutorial. Setting it again here caused the Home
  // highlight tour to fire a SECOND time right after this screen,
  // re-arming State._inTutorial with nothing to ever clear it — any
  // later Solo game (including real games) then incorrectly routed
  // through the tutorial-finish path. This is the tour's only trigger
  // point now.
  if (typeof Analytics !== 'undefined') {
    Analytics.track('tutorial_completed', { signed_in: !!State.user?.id });
  }
}

function tsumGoHome() {
  Sound.click();
  // Don't let Daily Reward interrupt the very next Home landing right
  // after finishing the guided tutorial — same onboarding moment, reads
  // as the tutorial itself breaking. It shows normally on any later
  // Home visit.
  State._skipDailyRewardOnce = true;
  goTo('home', true);
}
</script>
